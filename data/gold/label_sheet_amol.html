ity with cloud-based data platforms, such as aws, gcp, or azure  **what we offer:**  * competitive salary and benefits package * opportunities for professional growth and development * collaborative and dynamic work environment * access to cutting-edge technology and tools * flexible work arrangements, including remote work options  if you are a motivated and talented data scientist looking for a challenging and rewarding role, please submit your application, including your resume, cover letter, and any relevant work samples.", "cv_text": "**bob wilson** **contact information:**  * phone: (123) 456-7890 * email: [bobwilson@email.com](mailto:bobwilson@email.com) * linkedin: linkedin.com/in/bobwilson  **summary:** highly motivated and detail-oriented data scientist with 5+ years of experience in data analysis, machine learning, and data visualization. skilled in python, r, and sql with expertise in statistical modeling, data mining, and data storytelling.  **technical skills:**  * programming languages: python, r, sql * machine learning libraries: scikit-learn, tensorflow, pytorch * data visualization tools: matplotlib, seaborn, tableau * operating systems: windows, linux (ubuntu) * cloud platforms: amazon web services (aws), google cloud platform (gcp) * familiarity with agile development methodologies  **professional experience:**  * **data analyst**, abc company (2018-present)  + analyzed customer data to identify trends and opportunities for growth  + developed and maintained predictive models for forecasting sales and revenue  + created data visualizations to communicate insights to stakeholders  + collaborated with cross-functional teams to implement data-driven decisions * **junior data scientist**, def startups (2015-2018)  + built and deployed machine learning models for classification and regression tasks  + worked with large datasets (10m+ rows) to identify patterns and anomalies  + developed and maintained data pipelines using apache beam and apache spark  + presented findings and recommendations to senior leadership  **projects:**  * **predicting house prices using machine learning**: built a linear regression model using scikit-learn to predict house prices based on features such as number of bedrooms, square footage, and location. * **credit risk assessment**: developed a supervised learning model using tensorflow to predict credit risk based on credit history, income, and other factors. * **analyzing customer churn**: analyzed customer data using sql and python to identify trends and patterns related to customer churn, and developed a predictive model to forecast churn rates.  **education:**  * **master of science in data science**, university of california, berkeley (2015) * **bachelor of science in mathematics**, stanford university (2013)  **achievements:**  * **winner**, kaggle competition: predicting house prices (2019) * **finalist**, data science bowl: predicting cancer outcomes (2020) * **published research paper**, international journal of data science, on \"deep learning for time series forecasting\" (2020)  **certifications:**  * **certified data scientist**, data science council of america (2019) * **certified analytics professional**, institute for operations research and the management sciences (2018)  note: since bob was reject for the data scientist role, i've included a mix of his skills, experience, achievements, and projects to demonstrate his capabilities. however, i've also highlighted areas where he may have fallen short, such as:  * limited experience with deep learning frameworks (e.g., tensorflow, pytorch) * no experience with cloud-based data management platforms (e.g., aws, gcp) * limited experience with agile development methodologies * no experience with data engineering tools (e.g., apache beam, apache spark)  this type of feedback can be useful for bob to identify areas for improvement and to tailor his application materials for future opportunities."}, {"item_id": "014", "case_id": odologies and tools (e.g., surveys, focus groups). 4. **agile methodologies**: nirosha expressed some familiarity with agile principles but demonstrated a lack of practical experience with agile frameworks (e.g., scrum, kanban). her responses indicated a need for further education on agile methodologies and their application in product development. 5. **stakeholder communication**: nirosha's communication style was more focused on technical details than stakeholder engagement. she struggled to articulate how she would effectively communicate with cross-functional teams, including sales, marketing, and customer support. 6. **technical skills**: nirosha's technical skills were limited to basic programming concepts and data analysis using excel. her lack of experience with technical tools and technologies (e.g., cloud platforms, apis) was a concern, particularly for a product manager role that requires collaboration with engineering teams.  **concerns raised during the interview**  1. difficulty with tasks that required data analysis and interpretation, such as market research and competitive analysis. 2. lack of familiarity with project management tools and methodologies, which could hinder her ability to effectively manage projects. 3. struggles with articulating the importance of stakeholder communication and engagement. 4. limited understanding of agile methodologies and their application in product development.  **potential for growth**  despite these gaps, nirosha demonstrated a strong desire to learn and grow. with further training and exposure, she may be able to bridge the skills gaps identified during the interview. a development plan that addresses her weaknesses, such as:  1. product strategy development 2. project management and agile methodologies 3. market research and data analysis 4. stakeholder communication and engagement 5. technical skills and tool proficiency  could help nirosha build the necessary skills to succeed in a product manager role.  **r ta manipulation. she lacked experience with object-oriented programming, data structures, and algorithms. 6. **data science tools and technologies:** mythily was unfamiliar with popular data science tools like jupyter notebooks, docker, and git. she also struggled with version control and collaboration tools.  **concerns raised during the interview:**  * mythily had difficulty explaining complex statistical concepts and struggled to apply them to real-world problems. * she was unable to complete a simple data visualization task using tableau, citing lack of experience with the tool. * mythily struggled to design a data pipeline using hadoop and spark, highlighting her limited understanding of big data technologies. * she was unsure about the differences between supervised and unsupervised learning, demonstrating a lack of understanding of machine learning fundamentals.  **potential for growth:**  despite the gaps in her skills and experience, mythily showed enthusiasm and a willingness to learn. with further training and exposure to industry-standard tools and technologies, she could potentially develop the necessary skills to excel as a data scientist. it is essential to provide mythily with targeted training and mentorship to address her knowledge gaps and develop her skills in the areas mentioned above.  **recommendations:**  * provide mythily with a comprehensive training program covering machine learning, statistics, data visualization, and programming skills. * assign her a mentor who can guide her in learning industry-standard tools and technologies, such as tableau, power bi, jupyter notebooks, and docker. * encourage mythily to participate in data science competitions and hackathons to apply her skills in real-world scenarios. * consider providing mythily with a trial project or internship to gain practical experience and develop her skills further.  by addressing these gaps and providing targeted training, mythily desai has the potential to grow into a skilled data scientist."}, {"item_id": "114", "case_id": "case_01049", "role": "data scientist", "jd_text": "skilled data scientist with expertise in nlp, statistics and probability, deep learning, data manipulation expected_experience : 6-8 years", "cv_text": "mark mason contact information:  * email: [mark.mason@email.com](mailto:mark.mason@email.com) * phone: 555-555-5555 * linkedin: linkedin.com/in/markmason  summary: highly motivated and detail-oriented data scientist with expertise in python, data manipulation, statistics and probability, nlp, deep learning, and data visualization. proven track record of delivering insights-driven solutions to drive business growth.  technical skills:  * programming languages: python (2.7, 3.x) * data manipulation: pandas, numpy, matplotlib, seaborn * statistics and probability: statistical modeling, hypothesis testing, confidence intervals, bayesian methods * nlp: nltk, spacy, scikit-learn, tensorflow * deep learning: keras, tensorflow, pytorch * data visualization: matplotlib, seaborn, plotly, tableau * operating systems: windows, linux, macos * tools: jupyter notebook, git, sql, excel  work experience:  data scientist, xyz corporation (2018-present)  * developed predictive models using machine learning algorithms to forecast customer churn, resulting in a 25% reduction in churn rate * built and deployed nlp-based sentiment analysis tool to analyze customer feedback, leading to a 30% increase in customer satisfaction * collaborated with cross-functional teams to design and implement data-driven solutions for business growth * conducted exploratory data analysis and created visualizations to communicate insights to stakeholders  junior data analyst, abc startup (2016-2018)  * managed and analyzed large datasets using python and sql to identify trends and patterns * developed statistical models to forecast sales, resulting in a 15% increase in sales forecasting accuracy * created reports and dashboards using tableau to present in erience**: hiral's background was primarily in marketing and business development, with limited experience in the technology sector. they were unfamiliar with technical concepts and struggled to discuss the intersection of technology and business.  **concerns raised during the interview**  * difficulty in estimating project timelines and resource allocation * lack of familiarity with project management tools and technologies * uncertainty about how to prioritize product features and develop product roadmaps * struggles with complex technical explanations and stakeholder communication * limited experience in the technology sector and technical concepts  **growth potential**  despite the gaps in their skill set, hiral demonstrated a willingness to learn and adapt. with further training and exposure to the required areas, they may be able to bridge the gaps and become a strong product manager. however, it is essential to provide them with structured guidance and support to help them develop the necessary skills and knowledge.  **recommendations**  * provide hiral with training and mentorship in product strategy, project management, market research, agile methodologies, and stakeholder communication * assign a buddy or mentor to guide them in the technology sector and technical concepts * offer opportunities for hiral to work on smaller projects and gradually increase their responsibilities * regularly assess and provide feedback on hiral's progress, adjusting their training and support as needed"}, {"item_id": "143", "case_id": "case_08684", "role": "data analyst", "jd_text": "struggled to effectively communicate ideas., lacked key technical skills for the role.", "cv_text": "**candidate profile: pihu raghav**  **interview for data analyst role**  pihu raghav, a recent graduate in mathematics, presented herself as a detail-oriented and organized individual with a strong foundation in theoretical mathematics. while displaying a genuine interest in data analysis, pihu's  product development initiatives. 3. **market research**: tuhin's research skills were underdeveloped, and he relied heavily on anecdotal evidence rather than quantitative data to inform his decisions. he lacked experience with market research tools, such as surveys, user testing, and analytics platforms. 4. **agile methodologies**: tuhin was unfamiliar with agile frameworks and methodologies, which are essential for product development in the tech industry. he struggled to understand the principles of iterative development, continuous improvement, and flexible prioritization. 5. **stakeholder communication**: tuhin's communication style was often too technical, and he had difficulty articulating complex ideas to non-technical stakeholders. he also struggled to build and maintain relationships with cross-functional teams, which is critical for effective product management. 6. **technical expertise**: tuhin lacked experience with technical tools and platforms, such as data analysis software, cloud-based applications, and coding languages. he relied heavily on non-technical staff for technical guidance, which would hinder his ability to make informed decisions. 7. **financial acumen**: tuhin's understanding of financial concepts, such as budgeting, forecasting, and roi analysis, was limited. he struggled to make financial decisions and articulate their impact on the business.  **concerns raised during the interview**  * tuhin had difficulty with tasks that required data analysis and interpretation, such as identifying market trends and customer needs. * he was unfamiliar with project management tools, such as jira, asana, and trello, which are commonly used in the industry. * tuhin struggled to articulate a clear product vision and strategy, and he relied heavily on high-level concepts rather than concrete, data-driven insights. * he had difficulty with stakeholder communication, often using technical jargon and failing to build relationships with cross-functional teams.  **potential for growth**  despite these gaps, tuhin demonstrated a strong willingness to learn and grow. with further training and exposure, he may be able to develop the skills and expertise necessary to excel in a product manager role. some potential areas for growth include:  * developing a deeper understanding of product strategy, market research, and financial acumen * learning project management tools and methodologies * improving communication skills, particularly with non-technical stakeholders * gaining experience with technical tools and platforms  overall, tuhin verma showed potential as a candidate, but his skills and experience do not currently align with the requirements of the product manager role. with targeted training and development, he may be able to bridge these gaps and become a strong product manager."}, {"item_id": "147", "case_id": "case_03695", "role": "ux designer", "jd_text": "if you're passionate about data science, we need your expertise to help us deliver impactful products as a ux designer.", "cv_text": "here's a sample resume for john zamora, a ux designer:  john zamora contact information:  * phone: (123) 456-7890 * email: [jzamora@email.com](mailto:jzamora@email.com) * linkedin: linkedin.com/in/johnzamora * portfolio: johnzamora.com  professional summary: highly motivated and detail-oriented ux designer with 5+ years of experience in crafting intuitive and user-centered digital products. skilled in conducting user research, usability testing, and interaction design to drive business success. proven track record of delivering high-quality designs that meet business goals and user needs.  experience:  senior ux designer, xyz corporation (2018-present)  * led the design of multiple digital products, including websites, mobile apps, and web applications, resulting in a 25% increase in user engagement and a 15% reduction in bounce rates. * conducted user research and usability testing to inform design decisions, resulting in a 90% const NAME = "amol";
const KEY = "goldset_" + NAME;
let answers = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = 0;
const firstUnanswered = ITEMS.findIndex(t => !answers[t.item_id]);
if (firstUnanswered > 0) i = firstUnanswered;

function save() { localStorage.setItem(KEY, JSON.stringify(answers)); }

function render() {
  const n = ITEMS.length;
  const answered = Object.keys(answers).length;
  document.getElementById("prog").style.width = (100 * answered / n) + "%";
  document.getElementById("count").textContent = answered + " / " + n;

  if (i >= n) {
    document.getElementById("app").innerHTML =
      '<div class="done"><h1>Done — ' + answered + ' / ' + n + '</h1>' +
      '<p class="muted">Click Export and send the file to the other annotator.</p></div>';
    return;
  }

  const t = ITEMS[i];
  const a = answers[t.item_id] || {};
  document.getElementById("app").innerHTML = `
    <p class="muted">Item ${i + 1} of ${n}</p>
    <p class="role">${t.role}</p>
    <div class="card"><h2>Job description</h2><pre>${t.jd_text}</pre></div>
    <div class="card"><h2>Candidate CV</h2><pre>${t.cv_text}</pre></div>
    <div class="btns">
      <button class="sel ${a.decision === "select" ? "on" : ""}" data-d="select">SELECT <kbd>s</kbd></button>
      <button class="rej ${a.decision === "reject" ? "on" : ""}" data-d="reject">REJECT <kbd>r</kbd></button>
    </div>
    <p class="muted" style="margin:4px 0">Confidence</p>
    <div class="conf">
      ${["high", "medium", "low"].map(c =>
        `<button data-c="${c}" class="${a.confidence === c ? "on" : ""}">${c}</button>`).join("")}
    </div>
    <textarea id="note" placeholder="Optional: what decided it for you?">${a.note || ""}</textarea>
    <div class="nav">
      <button id="prev" ${i === 0 ? "disabled" : ""}>&larr; Back</button>
      <span class="muted">Keys: <kbd>s</kbd> select · <kbd>r</kbd> reject · <kbd>&rarr;</kbd> next</span>
      <button id="next">Next &rarr;</button>
    </div>`;

  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => choose(b.dataset.d));
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    answers[t.item_id] = Object.assign({}, answers[t.item_id], {confidence: b.dataset.c});
    save(); render();
  });
  document.getElementById("note").onblur = e => {
    if (answers[t.item_id]) { answers[t.item_id].note = e.target.value; save(); }
  };
  document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
  document.getElementById("next").onclick = () => { i++; render(); };
}

function choose(d) {
  const t = ITEMS[i];
  answers[t.item_id] = Object.assign({case_id: t.case_id, decision: d,
                                      ts: new Date().toISOString()},
                                     answers[t.item_id] || {}, {decision: d});
  save();
  setTimeout(() => { i++; render(); }, 120);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "s") choose("select");
  if (e.key === "r") choose("reject");
  if (e.key === "ArrowRight") { i++; render(); }
  if (e.key === "ArrowLeft" && i > 0) { i--; render(); }
});

document.getElementById("export").onclick = () => {
  const out = {annotator: NAME, exported: new Date().toISOString(),
               n_items: ITEMS.length, answers: answers};
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gold_labels_" + NAME + ".json";
  a.click();
};

render();
</script>
